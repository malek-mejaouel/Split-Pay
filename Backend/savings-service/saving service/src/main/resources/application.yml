server:
  port: 8086

spring:
  application:
    name: savings-service

  datasource:
    url: jdbc:postgresql://localhost:5432/savings_db
    username: postgres
    password: 231JMT7478
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000ms
          max-attempts: 3

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak : /realms/<realm>/protocol/openid-connect/certs
          jwk-set-uri: http://localhost:8080/realms/splitpay/protocol/openid-connect/certs

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# ===== Resilience4j =====
resilience4j:
  circuitbreaker:
    instances:
      walletService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      walletService:
        max-attempts: 3
        wait-duration: 500ms

# ===== Configuration metier =====
savings:
  rabbitmq:
    exchange: splitpay.events
    queue: savings.queue
    routing-key: wallet.debited
    dead-letter-exchange: splitpay.events.dlx
    dead-letter-queue: savings.queue.dlq
    dead-letter-routing-key: savings.dead
  goal:
    max-in-progress-per-account: 10
  roundup:
    retry-delay-ms: 60000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.splitpay.savings: INFO
